<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="560" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Header -->
  <text x="50" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">NAMMA SPACE — END-TO-END SPATIAL TWIN ARCHITECTURE</text>
  <text x="50" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Techfest IIT Bombay × Juspay • Production Photometric Reconstruction Pipeline</text>

  <!-- 4 Architecture Blocks -->
  <!-- 1. Capture & SOP -->
  <g transform="translate(50, 120)">
    <rect width="220" height="340" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="25" y="37" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">01</text>
    <text x="58" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Indoor Capture</text>
    <text x="15" y="75" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">SOP SPECIFICATION</text>
    
    <text x="15" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Smartphone 4K 60FPS</text>
    <text x="15" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">Manual 5600K WB & locked exp</text>
    
    <text x="15" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Volumetric Sweep</text>
    <text x="15" y="180" fill="#94a3b8" font-family="sans-serif" font-size="10">Perimeter walk with loop-closure</text>
    <text x="15" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">+30° loft & -25° floor coverage</text>

    <text x="15" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Keyframe Filtering</text>
    <text x="15" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10">Laplacian variance sharpness</text>
    <text x="15" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10">3 fps temporal extraction</text>

    <rect x="15" y="295" width="190" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="313" fill="#38bdf8" font-family="monospace" font-size="10">Output: Clean 4K Frames</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 285 290 L 305 290" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- 2. Reconstruction & SfM -->
  <g transform="translate(310, 120)">
    <rect width="220" height="340" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#0369a1" fill-opacity="0.2"/>
    <text x="25" y="37" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">02</text>
    <text x="58" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Spatial Synthesis</text>
    <text x="15" y="75" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PHOTOMETRIC ENGINE</text>

    <text x="15" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Pose Estimation (SfM)</text>
    <text x="15" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">COLMAP feature matching</text>
    <text x="15" y="140" fill="#94a3b8" font-family="sans-serif" font-size="10">Radial distortion correction</text>

    <text x="15" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• 3D Gaussian Splatting</text>
    <text x="15" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Anisotropic 3D covariance</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10">Spherical Harmonics color</text>

    <text x="15" y="245" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Geometry Extraction</text>
    <text x="15" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10">Dense point cloud decimation</text>

    <rect x="15" y="295" width="190" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="313" fill="#38bdf8" font-family="monospace" font-size="10">Output: .splat & glTF Mesh</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 545 290 L 565 290" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- 3. WebGL Engine & Viewer -->
  <g transform="translate(570, 120)">
    <rect width="220" height="340" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#4338ca" fill-opacity="0.2"/>
    <text x="25" y="37" fill="#818cf8" font-family="monospace" font-size="16" font-weight="bold">03</text>
    <text x="58" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Web Twin Runtime</text>
    <text x="15" y="75" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">THREE.JS & WEBGL</text>

    <text x="15" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• First-Person Roam</text>
    <text x="15" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">WASD + Pointer Lock look</text>
    <text x="15" y="140" fill="#94a3b8" font-family="sans-serif" font-size="10">Fixed 1.65m human eye height</text>

    <text x="15" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• Dollhouse Overview</text>
    <text x="15" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Elevated isometric orbit</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10">Structural wall cutaways</text>

    <text x="15" y="245" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• 2D Floorplan Radar</text>
    <text x="15" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10">Real-time (X, Z) + FOV cone</text>

    <rect x="15" y="295" width="190" height="28" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
    <text x="25" y="313" fill="#a5b4fc" font-family="monospace" font-size="10">60 FPS Hardware Vsync</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 805 290 L 825 290" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- 4. Round 2 POI & Navigation -->
  <g transform="translate(830, 120)">
    <rect width="220" height="340" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="25" y="37" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">04</text>
    <text x="58" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">POI & Pathfinding</text>
    <text x="15" y="75" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">ROUND 2 ADVANTAGE</text>

    <text x="15" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• 3D Spatial POI Index</text>
    <text x="15" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">Glowing pulsating beacons</text>
    <text x="15" y="140" fill="#94a3b8" font-family="sans-serif" font-size="10">Metadata inspection modals</text>

    <text x="15" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• A* Waypoint Routing</text>
    <text x="15" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Obstacle-free aisle spline</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10">Euclidean distance calculator</text>

    <text x="15" y="245" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">• AR Extension Ready</text>
    <text x="15" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10">WebXR on-site navigation</text>

    <rect x="15" y="295" width="190" height="28" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="313" fill="#6ee7b7" font-family="monospace" font-size="10">Status: Round 2 Verified</text>
  </g>

  <!-- Footer Banner -->
  <rect x="50" y="485" width="1000" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="70" y="511" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">VERIFIED RECONSTRUCTION BENCHMARK:</text>
  <text x="350" y="511" fill="#cbd5e1" font-family="sans-serif" font-size="11">48.2k active primitives • 60 FPS • Dual Camera Engine • Zero-Lag Pointer Lock</text>
</svg>
