name: Bug Report
description: File a bug report to help improve Luna
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the details below.
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      description: e.g. Chrome 122 on macOS, Firefox on Ubuntu
      placeholder: Chrome 122, Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
      placeholder: |
        1. Open live demo
        2. Click 'Enter Roam'
        3. Walk into wall
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
